<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">

<div class="proto" id="proto">
  <div class="proto-title"><b>Codex prototype</b><span>Controls here simulate the room. They are not part of the extension.</span><span>All sheets, creatures and players are synthetic samples.</span></div>
  <button class="pbtn proto-toggle" id="p-toggle" type="button" aria-expanded="false" aria-controls="p-ctl">Room controls</button>
  <div class="proto-ctl" id="p-ctl">
  <label class="proto-group"><span>You are</span>
    <select id="p-role"><option value="player">Sam, a player</option><option value="gm">The GM</option></select>
  </label>
  <label class="proto-group"><span>OBR theme</span>
    <select id="p-theme"><option value="system">Follow system</option><option value="dark">Dark</option><option value="light">Light</option></select>
  </label>
  <div class="proto-group"><span>Dice+</span>
    <button class="pbtn" id="p-dice" aria-pressed="true" type="button">Installed</button>
  </div>
  <label class="proto-group"><span>Someone rolls</span>
    <select id="p-incoming">
      <option value="">Choose…</option>
      <option value="breath">GM: Ash Drake, Fire Breath (DEX save)</option>
      <option value="bolt">Robin: Maren, Guiding Bolt</option>
      <option value="sneaky">Sam: Ilse, Stealth sent to GM only</option>
    </select>
  </label>
  <label class="proto-group"><span>Jump to state</span>
    <select id="p-state">
      <option value="">Choose…</option>
      <option value="firstrun">First run, no sheets</option>
      <option value="down">Character at 0 HP</option>
      <option value="storage">Browser storage blocked</option>
      <option value="readonly">GM viewing a player's sheet</option>
      <option value="reset">Reset everything</option>
    </select>
  </label>
  </div>
</div>

<div class="room" id="room">
  <div class="obr-bar" aria-hidden="true" id="obr-bar"></div>
  <div class="tokens" id="tokens"></div>
  <div id="pop-host"></div>
</div>
