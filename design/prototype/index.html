<title>Heroic Codex Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: prototype strip on top, simulated OBR room below; the Codex popover is a fixed-width panel anchored under OBR's action bar. */
:root {
  /* Simulated OBR theme, dark (OBR's default). Values approximate OBR's defaults from memory; the real
     extension reads them from OBR.theme.getTheme() at runtime, so verify against a live room during the build. */
  --bg: #222639;          /* background.default */
  --paper: #3d4051;       /* background.paper */
  --paper-2: #4a4e61;     /* hover / input fill */
  --line: #555a6e;
  --line-soft: rgba(255, 255, 255, 0.08);  /* row dividers */
  --text: #f4f4f8;        /* text.primary */
  --text-2: #c3c5d2;      /* text.secondary */
  --text-3: #9a9db0;      /* icons and borders only, never text */
  --accent: #bb99ff;      /* primary.main */
  --accent-ink: #cbb1ff;
  --on-accent: #1d1530;
  --accent-soft: rgba(187, 153, 255, 0.16);
  --danger: #ff7a7a;
  --danger-fill: #c93a3f;
  --danger-soft: rgba(255, 122, 122, 0.16);
  --warn: #f5b84a;
  --warn-soft: rgba(245, 184, 74, 0.14);
  --ok: #5fd3a0;
  --ok-soft: rgba(95, 211, 160, 0.14);
  --map: #181b28;
  --map-grid: rgba(255, 255, 255, 0.045);
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm: 6px;
  --r: 8px;
  --r-lg: 12px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0f5; --paper: #ffffff; --paper-2: #f2f3f8; --line: #dcdfe8; --line-soft: rgba(27, 30, 43, 0.08);
    --text: #1b1e2b; --text-2: #555a6e; --text-3: #6a6e82;
    --accent: #7b5cd6; --accent-ink: #6448c0; --on-accent: #ffffff; --accent-soft: rgba(123, 92, 214, 0.12);
    --danger: #c93636; --danger-fill: #c4383d; --danger-soft: rgba(201, 54, 54, 0.1);
    --warn: #9a6512; --warn-soft: rgba(196, 132, 29, 0.14);
    --ok: #17845a; --ok-soft: rgba(23, 132, 90, 0.12);
    --map: #d9dde6; --map-grid: rgba(0, 0, 0, 0.06);
    --shadow: 0 12px 32px rgba(27, 30, 43, 0.18), 0 2px 6px rgba(27, 30, 43, 0.1);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0f5; --paper: #ffffff; --paper-2: #f2f3f8; --line: #dcdfe8; --line-soft: rgba(27, 30, 43, 0.08);
  --text: #1b1e2b; --text-2: #555a6e; --text-3: #6a6e82;
  --accent: #7b5cd6; --accent-ink: #6448c0; --on-accent: #ffffff; --accent-soft: rgba(123, 92, 214, 0.12);
  --danger: #c93636; --danger-fill: #c4383d; --danger-soft: rgba(201, 54, 54, 0.1);
  --warn: #9a6512; --warn-soft: rgba(196, 132, 29, 0.14);
  --ok: #17845a; --ok-soft: rgba(23, 132, 90, 0.12);
  --map: #d9dde6; --map-grid: rgba(0, 0, 0, 0.06);
  --shadow: 0 12px 32px rgba(27, 30, 43, 0.18), 0 2px 6px rgba(27, 30, 43, 0.1);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex; flex-direction: column; min-height: 100%;
  background: var(--map);
  color: var(--text);
  font: 14px/1.4 var(--font);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--accent-soft); color: var(--text); }
::placeholder { color: var(--text-2); opacity: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Prototype strip (not part of the extension) ---------- */
.proto {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.proto-title { display: flex; flex-direction: column; margin-right: 6px; }
.proto-ctl { display: contents; }
.proto-toggle { display: none; }
@media (max-width: 560px) {
  .proto .proto-toggle { display: inline-flex; align-items: center; }
  .proto-ctl { display: none; width: 100%; flex-wrap: wrap; gap: 8px 14px; }
  .proto-ctl.open { display: flex; }
}
.proto-title b { font-size: 14px; }
.proto-title span { color: var(--text-2); font-size: 12px; }
.proto-group { display: flex; align-items: center; gap: 6px; }
.proto-group > span { color: var(--text-2); font-size: 12px; }
.proto select, .proto .pbtn {
  height: 30px; padding: 0 10px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--paper); font-size: 13px;
}
.proto .pbtn:hover { background: var(--paper-2); }
.proto .pbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- Simulated room ---------- */
.room {
  position: relative;
  flex: 1; display: flex; flex-direction: column; align-items: flex-start;
  min-height: 700px;
  background-color: var(--map);
  background-image:
    linear-gradient(var(--map-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--map-grid) 1px, transparent 1px);
  background-size: 64px 64px;
  padding: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
.obr-bar {
  display: inline-flex; gap: 4px; padding: 6px; border-radius: 999px;
  background: var(--bg); box-shadow: var(--shadow);
}
.obr-bar span {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2);
}
.obr-bar span.on { background: var(--accent-soft); color: var(--accent-ink); }
.tokens { position: absolute; inset: 0; pointer-events: none; }
.token {
  position: absolute; width: 60px; height: 60px; border-radius: 50%;
  display: grid; place-items: center; pointer-events: auto;
  border: 3px solid var(--tk, #888); background: var(--paper); color: var(--text);
  font-weight: 700; font-size: 18px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
}
.token small {
  position: absolute; top: 64px; white-space: nowrap; font-size: 12px; font-weight: 500;
  padding: 2px 6px; border-radius: 4px; background: var(--bg); color: var(--text);
}
.token[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 4px; }
.tokens.linking .token { cursor: crosshair; outline: 2px dashed var(--accent); outline-offset: 5px; animation: linkPulse 1.6s ease-in-out infinite; }
@keyframes linkPulse { 50% { outline-offset: 9px; } }

/* ---------- The Codex popover ---------- */
#pop-host { flex: 1; width: 100%; min-height: 0; display: flex; flex-direction: column; position: relative; z-index: 2; pointer-events: none; }
#pop-host > * { pointer-events: auto; }
.pop {
  --pw: 500px; --sw: 0px;
  position: relative; z-index: 2;
  width: min(calc(var(--pw) + var(--sw)), 100%);
  flex: 1; min-height: 560px; max-height: 900px;
  margin-top: 10px;
  background: var(--bg);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  display: flex;
  overflow: hidden;
  transition: width 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.pop.wide { --pw: 780px; }
.pop.log-open { --sw: 340px; }
.sheet {
  position: relative; width: var(--pw); max-width: 100%; flex: none; min-width: 0;
  display: flex; flex-direction: column; min-height: 0;
  container-type: inline-size;
}
.side {
  width: 340px; flex: none; display: flex; flex-direction: column; min-height: 0;
  border-left: 1px solid var(--line); background: var(--bg);
}
.side.anim { animation: sideIn 220ms cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes sideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
@media (max-width: 460px) {
  .side { width: 100% !important; }
}
@media (max-width: 899px) {
  .pop.log-open { --sw: 0px; }
  .side { position: absolute; top: 0; right: 0; bottom: 0; width: min(340px, 100%); z-index: 9; box-shadow: var(--shadow); }
}
.side-h { display: flex; align-items: center; gap: 8px; padding: 14px 12px 12px; border-bottom: 1px solid var(--line); }
.side-h h2 { margin: 0; font-size: 16px; font-weight: 700; flex: 1; }
.logbtn { position: relative; }
.logbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.logbtn .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--paper); }
.logbtn.flash { animation: flash 1.4s ease-out; }
.logbtn .priv { position: absolute; right: -5px; bottom: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); color: var(--accent-ink); display: grid; place-items: center; }
.logbtn .priv svg { width: 12px; height: 12px; }
.vis-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
.vis-row .seg { margin-left: auto; }
.vis-row + .quick { border-top: 0; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }

/* Header card */
.head { padding: 12px 12px 0; display: flex; flex-direction: column; gap: 10px; }
.head-card { background: var(--paper); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.id-row { display: flex; align-items: flex-start; gap: 8px; }
.switcher {
  flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 4px 6px; margin: -4px -6px;
  border-radius: var(--r); display: flex; flex-direction: column; gap: 2px;
}
.switcher:hover { background: var(--paper-2); }
.switcher .nm { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; line-height: 1.2; }
.switcher .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.switcher .nm svg { color: var(--text-2); }
.switcher .sub { color: var(--text-2); font-size: 13px; }
.switcher .nm .nm-link { display: inline-grid; place-items: center; color: var(--text-2); overflow: visible; }
.btn {
  height: 32px; padding: 0 12px; border-radius: var(--r-sm); border: 0;
  background: var(--paper-2); font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.btn:hover { filter: brightness(1.12); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { background: var(--danger-fill); color: #fff; }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--paper-2); filter: none; }
.btn.icon { width: 32px; padding: 0; }
.btn.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.btn:disabled { opacity: 0.5; cursor: default; filter: none; }

.vitals { display: flex; align-items: center; gap: 10px; }
.hp {
  flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 4px 6px; margin: -4px -6px; border-radius: var(--r);
  display: flex; flex-direction: column; gap: 6px;
}
.hp:hover { background: var(--paper-2); }
.hp-line { display: flex; align-items: baseline; gap: 6px; }
.hp-cur { font-size: 26px; font-weight: 700; line-height: 1; }
.hp-max { color: var(--text-2); font-size: 14px; }
.hp-temp { font-size: 12px; font-weight: 500; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 6px; border-radius: 999px; }
.bar { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--ok); transition: width 220ms ease-out; }
.bar i.t { background: var(--accent); }
.bar.mid i:first-child { background: var(--warn); }
.bar.low i:first-child { background: var(--danger-fill); }
.ac {
  width: 52px; height: 58px; flex: none; position: relative; display: grid; place-items: center; color: var(--paper-2);
}
.ac svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--paper-2); stroke: var(--line); stroke-width: 1; }
.ac div { position: relative; text-align: center; color: var(--text); line-height: 1; }
.ac b { display: block; font-size: 20px; }
.ac small { font-size: 11px; color: var(--text-2); font-weight: 500; letter-spacing: 0.04em; }
.ac div { display: flex; flex-direction: column; align-items: center; }
.seg { display: inline-flex; background: var(--paper-2); border-radius: var(--r-sm); padding: 2px; flex: none; }
.seg button { border: 0; background: none; height: 28px; padding: 0 9px; border-radius: 4px; font-size: 12px; font-weight: 500; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--text); }

.death { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.vitals.down { flex-wrap: wrap; row-gap: 10px; }
.vitals.down .death { flex-basis: calc(100% - 62px); }
.death-label { font-size: 12px; font-weight: 500; color: var(--danger); display: flex; align-items: center; gap: 6px; }
.death-row { display: flex; align-items: center; gap: 10px; }
.pips { display: inline-flex; gap: 4px; align-items: center; }
.pip {
  width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text-3); background: none; padding: 0;
}
.pip.on { background: var(--accent); border-color: var(--accent); }
.pip.ok.on { background: var(--ok); border-color: var(--ok); }
.pip.bad.on { background: var(--danger-fill); border-color: var(--danger-fill); }
.pip.spent { background: none; border-color: var(--text-3); opacity: 0.6; }
button.pip:disabled { cursor: default; opacity: 0.45; }

/* Banners */
.banner {
  margin: 0 12px; padding: 8px 10px; border-radius: var(--r); font-size: 13px;
  display: flex; align-items: center; gap: 8px; line-height: 1.35;
}
.banner.info { background: var(--accent-soft); color: var(--text); }
.banner.warn { background: var(--warn-soft); color: var(--text); }
.banner.warn svg { color: var(--warn); }
.banner .btn { margin-left: auto; height: 28px; }

/* Abilities */
.ab-k { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--text-2); }
.ab-m { font-size: 22px; font-weight: 700; line-height: 1.15; }
.ab-s { font-size: 12px; color: var(--text-2); }
.abil-wrap { padding: 10px 12px 0; display: flex; flex-direction: column; gap: 6px; }
.ledger { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--paper); border-radius: var(--r); overflow: hidden; }
.lg-cell {
  border: 0; background: none; padding: 7px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  border-left: 1px solid var(--line-soft); min-width: 0;
}
.ledger > .lg-cell:first-child { border-left: 0; }
button.lg-cell:hover:not(:disabled) { background: var(--paper-2); }
button.lg-cell:disabled { cursor: default; }
.lg-cell .ab-m { font-size: 22px; font-weight: 700; line-height: 1.15; }
.lg-cell .in.score { width: 46px; height: 30px; text-align: center; font-size: 16px; font-weight: 700; padding: 0; margin: 3px 0; }

/* Tabs */
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
.tabs button {
  border: 0; background: none; padding: 8px 10px 9px; font-size: 14px; font-weight: 500; color: var(--text-2);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--text); }

/* Body + wide layout */
.main { flex: 1; min-height: 0; display: flex; }
.col-main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; padding: 8px 12px 16px; }

/* Rows (actions, spells, skills, features) */
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line-soft); }
.li.open { background: var(--paper); border-radius: var(--r); border-top-color: transparent; margin: 4px 0; }
.li.open + * { border-top-color: transparent; }
.row {
  position: relative; display: flex; align-items: center; gap: 10px;
  min-height: 52px; padding: 6px 8px; border-radius: var(--r);
}
.row:hover { background: var(--paper); }
.li.open .row:hover { background: transparent; }
.row-main {
  flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0;
  display: flex; align-items: center; gap: 10px; align-self: stretch;
}
.row-main::after { content: ""; position: absolute; inset: 0; border-radius: var(--r); }
.row-main:focus-visible { outline: none; }
.row-main:focus-visible::after { outline: 2px solid var(--accent); outline-offset: -2px; }
.row-main:disabled { cursor: default; }
.row > :not(.row-main) { position: relative; z-index: 1; }
.tag {
  min-width: 30px; height: 22px; padding: 0 5px; border-radius: 4px; background: var(--paper-2);
  font-size: 11px; font-weight: 700; color: var(--text-2); display: grid; place-items: center; letter-spacing: 0.03em; flex: none;
}
.row-txt { min-width: 0; display: flex; flex-direction: column; }
.row-nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.row-meta, .row-fx { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.row-fx { white-space: normal; line-height: 1.45; }
.row-fx .fx-i { white-space: nowrap; }
.row-fx .rng { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.row-fx b { color: var(--text); font-weight: 500; }
.row-fx .fx-sep { color: var(--text-2); }
.row-nm .ell { overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--text-2); display: grid; place-items: center; }
.inline-ed { padding: 0 12px 12px; display: flex; flex-direction: column; }
.inline-ed .fs { background: none; border-radius: 0; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.inline-ed .ed-f { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.inline-ed .ed-f .grow { flex: 1; text-align: right; }
.mark { font-size: 11px; font-weight: 700; color: var(--text-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; line-height: 15px; }
.uses { display: inline-flex; gap: 4px; align-items: center; }
.uses .pip { width: 12px; height: 12px; }
.uses-lbl { font-size: 12px; color: var(--text-2); margin-left: 2px; }
.row .edit-tools { display: flex; gap: 2px; }
.row .grip { color: var(--text-3); }

.section-h {
  display: flex; align-items: center; gap: 10px; padding: 14px 8px 6px; font-size: 11px; font-weight: 700;
  letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-2);
}
.section-h:first-child { padding-top: 6px; }
.section-h .grow { flex: 1; }
.section-h .slot-lbl { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
.cast-line { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 8px 8px 2px; font-size: 13px; color: var(--text-2); }
.cast-line b { color: var(--text); font-weight: 700; }
.slots { display: inline-flex; gap: 4px; align-items: center; }
.slot { width: 14px; height: 14px; padding: 0; border-radius: 3px; border: 2px solid var(--text-3); background: none; }
.slot.on { background: var(--accent); border-color: var(--accent); }
button.slot:disabled { cursor: default; opacity: 0.45; }

.saves { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; margin-bottom: 4px; }
.pop.wide .saves { grid-template-columns: repeat(3, 1fr); }
.save-cell {
  border: 0; background: none; display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 3px 6px; text-align: left;
  border-top: 1px solid var(--line-soft); min-width: 0;
}
.save-cell:nth-child(-n+2) { border-top: 0; }
.pop.wide .save-cell:nth-child(3) { border-top: 0; }
button.save-cell:hover:not(:disabled) { background: var(--paper); }
button.save-cell:disabled { cursor: default; }
.save-cell .sv-n { font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-cell .val { font-weight: 700; }

<script>
const SRD = [["Darkness",2,"A","60 ft.",0,"",[],"Magical darkness spreads from a point you choose within range to fill a 15-foot-radius sphere for the duration. The darkness spreads around corners. A creature with darkvision can't see through this darkness, and nonmagical light can't illuminate it."],["Augury",2,"1M","Self",0,"",[],"By casting gem-inlaid sticks, rolling dragon bones, laying out ornate cards, or employing some other divining tool, you receive an omen from an otherworldly entity about the results of a specific course of action that you plan to take within the next 30 minutes. The DM chooses from the following possible omens:"],["Blur",2,"A","Self",0,"",[],"Your body becomes blurred, shifting and wavering to all who can see you. For the duration, any creature has disadvantage on attack rolls against you. An attacker is immune to this effect if it doesn't rely on sight, as with blindsight, or can see through illusions, as with truesight."],["Animal Friendship",1,"A","30 ft.",0,"wis",[],"This spell lets you convince a beast that you mean it no harm. Choose a beast that you can see within range. It must see and hear you. If the beast's Intelligence is 4 or higher, the spell fails. Otherwise, the beast must succeed on a Wisdom saving throw or be charmed by you for the spell's duration."],["Animal Messenger",2,"A","30 ft.",0,"",[],"By means of this spell, you use an animal to deliver a message. Choose a Tiny beast you can see within range, such as a squirrel, a blue jay, or a bat. You specify a location, which you must have visi…"],["Acid Splash",0,"A","60 ft.",0,"dex",[[1,6,"acid"]],"You hurl a bubble of acid. Choose one creature you can see within range, or choose two creatures you can see within range that are within 5 feet of each other. A target must succeed on a Dexterity saving throw or take 1d6 acid damage."],["Alarm",1,"1M","30 ft.",0,"",[],"You set an alarm against unwanted intrusion. Choose a door, a window, or an area within range that is no larger than a 20-foot cube. Until the spell ends, an alarm alerts you whenever a Tiny or larger creature touches or enters the warded area."],["Arcane Lock",2,"A","Touch",0,"",[],"You touch a closed door, window, gate, chest, or other entryway, and it becomes locked for the duration. You and the creatures you designate when you cast this spell can open the object normally. You can also set a password that, when spoken within 5 feet of the object, suppresses this spell for 1 minute."],["Detect Thoughts",2,"A","Self",0,"wis",[],"For the duration, you can read the thoughts of certain creatures. When you cast the spell and as your action on each turn until the spell ends, you can focus your mind on any one creature that you can see within 30 feet of you."],["Continual Flame",2,"A","Touch",0,"",[],"A flame, equivalent in brightness to a torch, springs forth from an object that you touch. The effect looks like a regular flame, but it creates no heat and doesn't use oxygen. A continual flame can be covered or hidden but not smothered or quenched."],["Darkvision",2,"A","Touch",0,"",[],"You touch a willing creature to grant it the ability to see in the dark. For the duration, that creature has darkvision out to a range of 60 feet."],["Blindness/Deafness",2,"A","30 ft.",0,"CON",[],"You can blind or deafen a foe. Choose one creature that you can see within range to make a Constitution saving throw. If it fails, the target is either blinded or deafened (your choice) for the duration. At the end of each of its turns, the target can make a Constitution saving throw. On a success, the spell ends."],["Alter Self",2,"A","Self",0,"",[],"You assume a different form. When you cast the spell, choose one of the following options, the effects of which last for the duration of the spell. While the spell lasts, you can end one option as an action to gain the benefits of a different one."],["Barkskin",2,"A","Touch",0,"",[],"You touch a willing creature. Until the spell ends, the target's skin has a rough, bark-like appearance, and the target's AC can't be less than 16, regardless of what kind of armor it is wearing."],["Branding Smite",2,"BA","Self",1,"",[[2,6,"radiant"]],"The next time you hit a creature with a weapon attack before this spell ends, the weapon gleams with astral radiance as you strike. The attack deals an extra 2d6 radiant damage to the target, which be…"],["Calm Emotions",2,"A","60 ft.",0,"cha",[],"You attempt to suppress strong emotions in a group of people. Each humanoid in a 20-foot-radius sphere centered on a point you choose within range must make a Charisma saving throw; a creature can choose to fail this saving throw if it wishes."],["Enhance Ability",2,"A","Touch",0,"",[],"You touch a creature and bestow upon it a magical enhancement. Choose one of the following effects; the target gains that effect until the spell ends."],["Druidcraft",0,"A","30 ft.",0,"",[],"Whispering to the spirits of nature, you create one of the following effects within range:"],["Guidance",0,"A","Touch",0,"",[],"You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one ability check of its choice. It can roll the die before or after making the ability check. The spell then ends."],["Magic Missile",1,"A","120 ft.",0,"",[[1,4,"force"],[1,4,"force"],[1,4,"force"]],"You create three glowing darts of magical force. Each dart hits a creature of your choice that you can see within range. A dart deals 1d4 + 1 force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several."],["Animate Dead",3,"1M","10 ft.",0,"",[],"This spell creates an undead servant. Choose a pile of bones or a corpse of a Medium or Small humanoid within range. Your spell imbues the target with a foul mimicry of life, raising it as an undead creature."],["Animate Objects",5,"A","120 ft.",0,"",[],"Objects come to life at your command. Choose up to ten nonmagical objects within range that are not being worn or carried. Medium targets count as two objects, Large targets count as four objects, Huge targets count as eight objects. You can't animate any object larger than Huge."],["Fire Bolt",0,"A","120 ft.",1,"",[[1,10,"fire"]],"You hurl a mote of fire at a creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 fire damage. A flammable object hit by this spell ignites if it isn't being worn or carried."],["False Life",1,"A","Self",0,"",[[1,4,"temp. hp"]],"Bolstering yourself with a necromantic facsimile of life, you gain 1d4 + 4 temporary hit points for the duration."],["Mending",0,"1M","Touch",0,"",[],"This spell repairs a single break or tear in an object you touch, such as broken chain link, two halves of a broken key, a torn cloak, or a leaking wineskin. As long as the break or tear is no larger than 1 foot in any dimension, you mend it, leaving no trace of the former damage."],["Dancing Lights",0,"A","120 ft.",0,"",[],"You create up to four torch-sized lights within range, making them appear as torches, lanterns, or glowing orbs that hover in the air for the duration. You can also combine the four lights into one glowing vaguely humanoid form of Medium size. Whichever form you choose, each light sheds dim light in a 10- foot radius."],["Mage Hand",0,"A","30 ft.",0,"",[],"A spectral, floating hand appears at a point you choose within range. The hand lasts for the duration or until you dismiss it as an action. The hand vanishes if it is ever more than 30 feet away from you or if you cast this spell again."],["Shillelagh",0,"BA","Touch",0,"",[],"The wood of a club or quarterstaff you are holding is imbued with nature's power. For the duration, you can use your spellcasting ability instead of Strength for the attack and damage rolls of melee attacks using that weapon, and the weapon's damage die becomes a d8."],["Chill Touch",0,"A","120 ft.",1,"",[[1,8,"necrotic"]],"You create a ghostly, skeletal hand in the space of a creature within range. Make a ranged spell attack against the creature to assail it with the chill of the grave. On a hit, the target takes 1d8 necrotic damage, and it can't regain hit points until the start of your next turn."],["Message",0,"A","120 ft.",0,"",[],"You point your finger toward a creature within range and whisper a message. The target (and only the target) hears the message and can reply in a whisper that only you can hear."],["Produce Flame",0,"A","Self",1,"",[[1,8,"fire"]],"A flickering flame appears in your hand. The flame remains there for the duration and harms neither you nor your equipment. The flame sheds bright light in a 10-foot radius and dim light for an additional 10 feet. The spell ends if you dismiss it as an action or if you cast it again."],["Sacred Flame",0,"A","60 ft.",0,"dex",[[1,8,"radiant"]],"Flame-like radiance descends on a creature that you can see within range. The target must succeed on a Dexterity saving throw or take 1d8 radiant damage. The target gains no benefit from cover for this saving throw."],["True Strike",0,"A","30 ft.",0,"",[],"You extend your hand and point a finger at a target in range. Your magic grants you a brief insight into the target's defenses. On your next turn, you gain advantage on your first attack roll against the target, provided that this spell hasn't ended."],["Eldritch Blast",0,"A","120 ft.",1,"",[[1,10,"force"]],"A beam of crackling energy streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 force damage."],["Animal Shapes",8,"A","30 ft.",0,"",[],"Your magic turns others into beasts. Choose any number of willing creatures that you can see within range. You transform each target into the form of a Large or smaller beast with a challenge rating of 4 or lower. On subsequent turns, you can use your action to transform affected creatures into new forms."],["Minor Illusion",0,"A","30 ft.",0,"",[],"You create a sound or an image of an object within range that lasts for the duration. The illusion also ends if you dismiss it as an action or cast this spell again."],["Prestidigitation",0,"A","10 ft.",0,"",[],"This spell is a minor magical trick that novice spellcasters use for practice. You create one of the following magical effects within range:"],["Shocking Grasp",0,"A","Touch",1,"",[[1,8,"lightning"]],"Lightning springs from your hand to deliver a shock to a creature you try to touch. Make a melee spell attack against the target. You have advantage on the attack roll if the target is wearing armor made of metal."],["Thaumaturgy",0,"A","30 ft.",0,"",[],"You manifest a minor wonder, a sign of supernatural power, within range. You create one of the following magical effects within range:"],["Poison Spray",0,"A","10 ft.",0,"CON",[[1,12,"poison"]],"You extend your hand toward a creature you can see within range and project a puff of noxious gas from your palm. The creature must succeed on a Constitution saving throw or take 1d12 poison damage."],["Ray of Frost",0,"A","60 ft.",1,"",[[1,8,"cold"]],"A frigid beam of blue-white light streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 cold damage, and its speed is reduced by 10 feet until the start of your next turn."],["Spare the Dying",0,"A","Touch",0,"",[],"You touch a living creature that has 0 hit points. The creature becomes stable. This spell has no effect on undead or constructs."],["Vicious Mockery",0,"A","60 ft.",0,"wis",[[1,4,"psychic"]],"You unleash a string of insults laced with subtle enchantments at a creature you can see within range. If the target can hear you (though it need not understand you), it must succeed on a Wisdom savin…"],["Resistance",0,"A","Touch",0,"",[],"You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one saving throw of its choice. It can roll the die before or after making the saving throw. The spell then ends."],["Color Spray",1,"A","Self (15-foot cone)",0,"",[],"A dazzling array of flashing, colored light springs from your hand. Roll 6d10; the total is how many hit points of creatures this spell can effect. Creatures in a 15-foot cone originating from you are affected in ascending order of their current hit points (ignoring unconscious creatures and creatures that can't see)."],["Find Familiar",1,"1H","10 ft.",0,"",[],"You gain the service of a familiar, a spirit that takes an animal form you choose: bat, cat, crab, frog (toad), hawk, lizard, octopus, owl, poisonous snake, fish (quipper), rat, raven, sea horse, spider, or weasel."],["Command",1,"A","60 ft.",0,"wis",[],"You speak a one-word command to a creature you can see within range. The target must succeed on a Wisdom saving throw or follow the command on its next turn. The spell has no effect if the target is undead, if it doesn't understand your language, or if your command is directly harmful to it."],["Divine Favor",1,"BA","Self",0,"",[[1,4,"radiant"]],"Your prayer empowers you with divine radiance. Until the spell ends, your weapon attacks deal an extra 1d4 radiant damage on a hit."],["Entangle",1,"A","90 ft.",0,"str",[],"Grasping weeds and vines sprout from the ground in a 20-foot square starting from a point within range. For the duration, these plants turn the ground in the area into difficult terrain."],["Grease",1,"A","60 ft.",0,"dex",[],"Slick grease covers the ground in a 10-foot square centered on a point within range and turns it into difficult terrain for the duration."],["Comprehend Languages",1,"A","Self",0,"",[],"For the duration, you understand the literal meaning of any spoken language that you hear. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text."],["Expeditious Retreat",1,"BA","Self",0,"",[],"This spell allows you to move at an incredible pace. When you cast this spell, and then as a bonus action on each of your turns until the spell ends, you can take the Dash action."],["Fog Cloud",1,"A","120 ft.",0,"",[],"You create a 20-foot-radius sphere of fog centered on a point within range. The sphere spreads around corners, and its area is heavily obscured. It lasts for the duration or until a wind of moderate or greater speed (at least 10 miles per hour) disperses it."],["Detect Magic",1,"A","Self",0,"",[],"For the duration, you sense the presence of magic within 30 feet of you. If you sense magic in this way, you can use your action to see a faint aura around any visible creature or object in the area that bears magic, and you learn its school of magic, if any."],["Burning Hands",1,"A","Self (15-foot cone)",0,"dex",[[3,6,"fire"]],"As you hold your hands with thumbs touching and fingers spread, a thin sheet of flames shoots forth from your outstretched fingertips. Each creature in a 15-foot cone must make a Dexterity saving throw. A creature takes 3d6 fire damage on a failed save, or half as much damage on a successful one."],["Charm Person",1,"A","30 ft.",0,"wis",[],"You attempt to charm a humanoid you can see within range. It must make a Wisdom saving throw, and does so with advantage if you or your companions are fighting it. If it fails the saving throw, it is charmed by you until the spell ends or until you or your companions do anything harmful to it."],["Disguise Self",1,"A","Self",0,"",[],"You make yourself—including your clothing, armor, weapons, and other belongings on your person—look different until the spell ends or until you use your action to dismiss it. You can seem 1 foot shorter or taller and can appear thin, fat, or in between."],["Goodberry",1,"A","Touch",0,"",[],"Up to ten berries appear in your hand and are infused with magic for the duration. A creature can use its action to eat one berry. Eating a berry restores 1 hit point, and the berry provides enough nourishment to sustain a creature for one day."],["Cure Wounds",1,"A","Touch",0,"",[[1,8,"healing"]],"A creature you touch regains a number of hit points equal to 1d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs."],["Faerie Fire",1,"A","60 ft.",0,"dex",[],"Each object in a 20-foot cube within range is outlined in blue, green, or violet light (your choice). Any creature in the area when the spell is cast is also outlined in light if it fails a Dexterity saving throw. For the duration, objects and affected creatures shed dim light in a 10-foot radius."],["Feather Fall",1,"R","60 ft.",0,"",[],"Choose up to five falling creatures within range. A falling creature's rate of descent slows to 60 feet per round until the spell ends. If the creature lands before the spell ends, it takes no falling damage and can land on its feet, and the spell ends for that creature."],["Bane",1,"A","30 ft.",0,"cha",[],"Up to three creatures of your choice that you can see within range must make Charisma saving throws. Whenever a target that fails this saving throw makes an attack roll or a saving throw before the spell ends, the target must roll a d4 and subtract the number rolled from the attack roll or saving throw."],["Bless",1,"A","30 ft.",0,"",[],"You bless up to three creatures of your choice within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target can roll a d4 and add the number rolled to the attack roll or saving throw."],["Create or Destroy Water",1,"A","30 ft.",0,"",[],"You either create or destroy water."],["Detect Evil and Good",1,"A","Self",0,"",[],"For the duration, you know if there is an aberration, celestial, elemental, fey, fiend, or undead within 30 feet of you, as well as where the creature is located. Similarly, you know if there is a place or object within 30 feet of you that has been magically consecrated or desecrated."],["Detect Poison and Disease",1,"A","Self",0,"",[],"For the duration, you can sense the presence and location of poisons, poisonous creatures, and diseases within 30 feet of you. You also identify the kind of poison, poisonous creature, or disease in each case."],["Identify",1,"1M","Touch",0,"",[],"You choose one object that you must touch throughout the casting of the spell. If it is a magic item or some other magic-imbued object, you learn its properties and how to use them, whether it requires attunement to use, and how many charges it has, if any."],["Illusory Script",1,"1M","Touch",0,"",[],"You write on parchment, paper, or some other suitable writing material and imbue it with a potent illusion that lasts for the duration."],["Shield",1,"R","Self",0,"",[],"An invisible barrier of magical force appears and protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from magic missile."],["Speak with Animals",1,"A","Self",0,"",[],"You gain the ability to comprehend and verbally communicate with beasts for the duration. The knowledge and awareness of many beasts is limited by their intelligence, but at minimum, beasts can give y…"],["Guiding Bolt",1,"A","120 ft.",1,"",[[4,6,"radiant"]],"A flash of light streaks toward a creature of your choice within range. Make a ranged spell attack against the target. On a hit, the target takes 4d6 radiant damage, and the next attack roll made agai…"],["Protection from Evil and Good",1,"A","Touch",0,"",[],"Until the spell ends, one willing creature you touch is protected against certain types of creatures: aberrations, celestials, elementals, fey, fiends, and undead."],["Floating Disk",1,"A","30 ft.",0,"",[],"This spell creates a circular, horizontal plane of force, 3 feet in diameter and 1 inch thick, that floats 3 feet above the ground in an unoccupied space of your choice that you can see within range. The disk remains for the duration, and can hold up to 500 pounds."],["Jump",1,"A","Touch",0,"",[],"You touch a creature. The creature's jump distance is tripled until the spell ends."],["Mage Armor",1,"A","Touch",0,"",[],"You touch a willing creature who isn't wearing armor, and a protective magical force surrounds it until the spell ends. The target's base AC becomes 13 + its Dexterity modifier. The spell ends if the target dons armor or if you dismiss the spell as an action."],["Shield of Faith",1,"BA","60 ft.",0,"",[],"A shimmering field appears and surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration."],["Hideous Laughter",1,"A","30 ft.",0,"wis",[],"A creature of your choice that you can see within range perceives everything as hilariously funny and falls into fits of laughter if this spell affects it. The target must succeed on a Wisdom saving throw or fall prone, becoming incapacitated and unable to stand up for the duration."],["Aid",2,"A","30 ft.",0,"",[],"Your spell bolsters your allies with toughness and resolve. Choose up to three creatures within range. Each target's hit point maximum and current hit points increase by 5 for the duration."],["Hellish Rebuke",1,"R","60 ft.",0,"dex",[[2,10,"fire"]],"You point your finger, and the creature that damaged you is momentarily surrounded by hellish flames. The creature must make a Dexterity saving throw. It takes 2d10 fire damage on a failed save, or half as much damage on a successful one."],["Hunter's Mark",1,"BA","90 ft.",0,"",[[1,6,"damage"]],"You choose a creature you can see within range and mystically mark it as your quarry. Until the spell ends, you deal an extra 1d6 damage to the target whenever you hit it with a weapon attack, and you have advantage on any Wisdom (Perception) or Wisdom (Survival) check you make to find it."],["Inflict Wounds",1,"A","Touch",1,"",[[3,10,"necrotic"]],"Make a melee spell attack against a creature you can reach. On a hit, the target takes 3d10 necrotic damage."],["Longstrider",1,"A","Touch",0,"",[],"You touch a creature. The target's speed increases by 10 feet until the spell ends."],["Sleep",1,"A","90 ft.",0,"",[],"This spell sends creatures into a magical slumber. Roll 5d8; the total is how many hit points of creatures this spell can affect. Creatures within 20 feet of a point you choose within range are affected in ascending order of their current hit points (ignoring unconscious creatures)."],["Thunderwave",1,"A","Self (15-foot cube)",0,"CON",[[2,8,"thunder"]],"A wave of thunderous force sweeps out from you. Each creature in a 15-foot cube originating from you must make a Constitution saving throw. On a failed save, a creature takes 2d8 thunder damage and is pushed 10 feet away from you. On a successful save, the creature takes half as much damage and isn't pushed."],["Heroism",1,"A","Touch",0,"",[],"A willing creature you touch is imbued with bravery. Until the spell ends, the creature is immune to being frightened and gains temporary hit points equal to your spellcasting ability modifier at the start of each of its turns. When the spell ends, the target loses any remaining temporary hit points from this spell."],["Purify Food and Drink",1,"A","10 ft.",0,"",[],"All nonmagical food and drink within a 5-foot-radius sphere centered on a point of your choice within range is purified and rendered free of poison and disease."],["Sanctuary",1,"BA","30 ft.",0,"wis",[],"You ward a creature within range against attack. Until the spell ends, any creature who targets the warded creature with an attack or a harmful spell must first make a Wisdom saving throw. On a failed save, the creature must choose a new target or lose the attack or spell."],["Silent Image",1,"A","60 ft.",0,"",[],"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn't accompanied by sound, smell, or other sensory effects."],["Healing Word",1,"BA","60 ft.",0,"",[[1,4,"healing"]],"A creature of your choice that you can see within range regains hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs."],["Unseen Servant",1,"A","60 ft.",0,"",[],"This spell creates an invisible, mindless, shapeless, Medium force that performs simple tasks at your command until the spell ends. The servant springs into existence in an unoccupied space on the ground within range. It has AC 10, 1 hit point, and a Strength of 2, and it can't attack."],["Polymorph",4,"A","60 ft.",0,"",[],"This spell transforms a creature that you can see within range into a new form. An unwilling creature must make a Wisdom saving throw to avoid the effect. The spell has no effect on a shapechanger or a creature with 0 hit points."],["Gust of Wind",2,"A","Self (60-foot line)",0,"str",[],"A line of strong wind 60 feet long and 10 feet wide blasts from you in a direction you choose for the spell's duration. Each creature that starts its turn in the line must succeed on a Strength saving throw or be pushed 15 feet away from you in a direction following the line."],["Water Walk",3,"A","30 ft.",0,"",[],"This spell grants the ability to move across any liquid surface—such as water, acid, mud, snow, quicksand, or lava—as if it were harmless solid ground (creatures crossing molten lava can still take damage from the heat). Up to ten willing creatures you can see within range gain this ability for the duration."],["Speak with Plants",3,"A","Self (30-foot radius)",0,"",[],"You imbue plants within 30 feet of you with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in th…"],["Conjure Minor Elementals",4,"1M","90 ft.",0,"",[],"You summon elementals that appear in unoccupied spaces that you can see within range. You choose one the following options for what appears:"],["Conjure Animals",3,"A","60 ft.",0,"",[],"You summon fey spirits that take the form of beasts and appear in unoccupied spaces that you can see within range. Choose one of the following options for what appears:"],["Wall of Fire",4,"A","120 ft.",0,"dex",[[5,8,"fire"]],"You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration."],["Transport via Plants",6,"A","10 ft.",0,"",[],"This spell creates a magical link between a Large or larger inanimate plant within range and another plant, at any distance, on the same plane of existence. You must have seen or touched the destination plant at least once before."],["Conjure Elemental",5,"1M","90 ft.",0,"",[],"You call forth an elemental servant. Choose an area of air, earth, fire, or water that fills a 10-foot cube within range. An elemental of challenge rating 5 or lower appropriate to the area you chose appears in an unoccupied space within 10 feet of it."],["Spiritual Weapon",2,"BA","60 ft.",0,"",[],"You create a floating, spectral weapon within range that lasts for the duration or until you cast this spell again. When you cast the spell, you can make a melee spell attack against a creature within 5 feet of the weapon. On a hit, the target takes force damage equal to 1d8 + your spellcasting ability modifier."],["Fireball",3,"A","150 ft. / 20 ft. sphere",0,"dex",[[8,6,"fire"]],"A bright streak flashes from your pointing finger to a point you choose within range and then blossoms with a low roar into an explosion of flame. Each creature in a 20-foot-radius sphere centered on that point must make a Dexterity saving throw."],["Haste",3,"A","30 ft.",0,"",[],"Choose a willing creature that you can see within range. Until the spell ends, the target's speed is doubled, it gains a +2 bonus to AC, it has advantage on Dexterity saving throws, and it gains an additional action on each of its turns."],["Light",0,"A","Touch",0,"dex",[],"You touch one object that is no larger than 10 feet in any dimension. Until the spell ends, the object sheds bright light in a 20-foot radius and dim light for an additional 20 feet. The light can be colored as you like. Completely covering the object with something opaque blocks the light."],["Counterspell",3,"R","60 ft.",0,"",[],"You attempt to interrupt a creature in the process of casting a spell. If the creature is casting a spell of 3rd level or lower, its spell fails and has no effect. If it is casting a spell of 4th level or higher, make an ability check using your spellcasting ability. The DC equals 10 + the spell's level."],["Cone of Cold",5,"A","Self (60-foot cone)",0,"CON",[[8,8,"cold"]],"A blast of cold air erupts from your hands. Each creature in a 60-foot cone must make a Constitution saving throw. A creature takes 8d8 cold damage on a failed save, or half as much damage on a successful one."],["Misty Step",2,"BA","Self",0,"",[],"Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space that you can see."],["Spider Climb",2,"A","Touch",0,"",[],"Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and upside down along ceilings, while leaving its hands free. The target also gains a climbing speed equal to its walking speed."],["Greater Invisibility",4,"A","Touch",0,"",[],"You or a creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target's person."],["Ice Storm",4,"A","300 ft.",0,"dex",[[2,8,"bludgeoning"],[4,6,"cold"]],"A hail of rock-hard ice pounds to the ground in a 20-foot-radius, 40-foot-high cylinder centered on a point within range. Each creature in the cylinder must make a Dexterity saving throw. A creature takes 2d8 bludgeoning damage and 4d6 cold damage on a failed save, or half as much damage on a successful one."],["Hold Person",2,"A","60 ft.",0,"wis",[],"Choose a humanoid that you can see within range. The target must succeed on a Wisdom saving throw or be paralyzed for the duration. At the end of each of its turns, the target can make another Wisdom saving throw. On a success, the spell ends on the target."],["Suggestion",2,"A","30 ft.",0,"wis",[],"You suggest a course of activity (limited to a sentence or two) and magically influence a creature you can see within range that can hear and understand you. Creatures that can't be charmed are immune to this effect. The suggestion must be worded in such a manner as to make the course of action sound reasonable."],["Fly",3,"A","Touch",0,"",[],"You touch a willing creature. The target gains a flying speed of 60 feet for the duration. When the spell ends, the target falls if it is still aloft, unless it can stop the fall."],["Lesser Restoration",2,"A","Touch",0,"",[],"You touch a creature and can end either one disease or one condition afflicting it. The condition can be blinded, deafened, paralyzed, or poisoned."],["Dispel Magic",3,"A","120 ft.",0,"",[],"Choose one creature, object, or magical effect within range. Any spell of 3rd level or lower on the target ends. For each spell of 4th level or higher on the target, make an ability check using your spellcasting ability. The DC equals 10 + the spell's level. On a successful check, the spell ends."],["Spirit Guardians",3,"A","Self (15-foot radius)",0,"wis",[[3,8,"radiant"]],"You call forth spirits to protect you. They flit around you to a distance of 15 feet for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish."],["Knock",2,"A","60 ft.",0,"",[],"Choose an object that you can see within range. The object can be a door, a box, a chest, a set of manacles, a padlock, or another object that contains a mundane or magical means that prevents access."],["Arcanist's Magic Aura",2,"A","Touch",0,"",[],"You place an illusion on a creature or an object you touch so that divination spells reveal false information about it. The target can be a willing creature or an object that isn't being carried or worn by another creature."],["Web",2,"A","60 ft.",0,"dex",[],"You conjure a mass of thick, sticky webbing at a point of your choice within range. The webs fill a 20-foot cube from that point for the duration. The webs are difficult terrain and lightly obscure their area."],["Clairvoyance",3,"10M","1 mile",0,"",[],"You create an invisible sensor within range in a location familiar to you (a place you have visited or seen before) or in an obvious location that is unfamiliar to you (such as behind a door, around a corner, or in a grove of trees)."],["Create Food and Water",3,"A","30 ft.",0,"",[],"You create 45 pounds of food and 30 gallons of water on the ground or in containers within range, enough to sustain up to fifteen humanoids or five steeds for 24 hours. The food is bland but nourishing, and spoils if uneaten after 24 hours. The water is clean and doesn't go bad."],["Flame Blade",2,"BA","Self",1,"",[[3,6,"fire"]],"You evoke a fiery blade in your free hand. The blade is similar in size and shape to a scimitar, and it lasts for the duration. If you let go of the blade, it disappears, but you can evoke the blade again as a bonus action."],["Gentle Repose",2,"A","Touch",0,"",[],"You touch a corpse or other remains. For the duration, the target is protected from decay and can't become undead."],["Heat Metal",2,"A","60 ft.",0,"CON",[[2,8,"fire"]],"Choose a manufactured metal object, such as a metal weapon or a suit of heavy or medium metal armor, that you can see within range. You cause the object to glow red-hot. Any creature in physical contact with the object takes 2d8 fire damage when you cast the spell."],["Magic Mouth",2,"1M","30 ft.",0,"",[],"You implant a message within an object in range, a message that is uttered when a trigger condition is met. Choose an object that you can see and that isn't being worn or carried by another creature. Then speak the message, which must be 25 words or less, though it can be delivered over as long as 10 minutes."],["Acid Arrow",2,"A","90 ft.",1,"",[[4,4,"acid"],[2,4,"acid"]],"A shimmering green arrow streaks toward a target within range and bursts in a spray of acid. Make a ranged spell attack against the target. On a hit, the target takes 4d4 acid damage immediately and 2d4 acid damage at the end of its next turn."],["Pass without Trace",2,"A","Self",0,"",[],"A veil of shadows and silence radiates from you, masking you and your companions from detection. For the duration, each creature you choose within 30 feet of you (including you) has a +10 bonus to Dexterity (Stealth) checks and can't be tracked except by magical means."],["Prayer of Healing",2,"10M","30 ft.",0,"",[[2,8,"healing"]],"Up to six creatures of your choice that you can see within range each regain hit points equal to 2d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs."],["Enlarge/Reduce",2,"A","30 ft.",0,"CON",[],"You cause a creature or an object you can see within range to grow larger or smaller for the duration. Choose either a creature or an object that is neither worn nor carried. If the target is unwilling, it can make a Constitution saving throw. On a success, the spell has no effect."],["Enthrall",2,"A","60 ft.",0,"wis",[],"You weave a distracting string of words, causing creatures of your choice that you can see within range and that can hear you to make a Wisdom saving throw. Any creature that can't be charmed succeeds…"],["Ray of Enfeeblement",2,"A","60 ft.",1,"CON",[],"A black beam of enervating energy springs from your finger toward a creature within range. Make a ranged spell attack against the target. On a hit, the target deals only half damage with weapon attacks that use Strength until the spell ends."],["Shatter",2,"A","60 ft.",0,"CON",[[3,8,"thunder"]],"A sudden loud ringing noise, painfully intense, erupts from a point of your choice within range. Each creature in a 10-foot-radius sphere centered on that point must make a Constitution saving throw. A creature takes 3d8 thunder damage on a failed save, or half as much damage on a successful one."],["Blink",3,"A","Self",0,"",[],"Roll a d20 at the end of each of your turns for the duration of the spell. On a roll of 11 or higher, you vanish from your current plane of existence and appear in the Ethereal Plane (the spell fails and the casting is wasted if you were already on that plane)."],["Invisibility",2,"A","Touch",0,"",[],"A creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target's person. The spell ends for a target that attacks or casts a spell."],["Locate Object",2,"A","Self",0,"",[],"Describe or name an object that is familiar to you. You sense the direction to the object's location, as long as that object is within 1,000 feet of you. If the object is in motion, you know the direction of its movement."],["Magic Weapon",2,"BA","Touch",0,"",[],"You touch a nonmagical weapon. Until the spell ends, that weapon becomes a magic weapon with a +1 bonus to attack rolls and damage rolls."],["Mirror Image",2,"A","Self",0,"",[],"Three illusory duplicates of yourself appear in your space. Until the spell ends, the duplicates move with you and mimic your actions, shifting position so it's impossible to track which image is real. You can use your action to dismiss the illusory duplicates."],["Moonbeam",2,"A","120 ft.",1,"CON",[[2,10,"radiant"]],"A silvery beam of pale light shines down in a 5-foot-radius, 40-foot-high cylinder centered on a point within range. Until the spell ends, dim light fills the cylinder."],["Protection from Poison",2,"A","Touch",0,"",[],"You touch a creature. If it is poisoned, you neutralize the poison. If more than one poison afflicts the target, you neutralize one poison that you know is present, or you neutralize one at random."],["Scorching Ray",2,"A","120 ft.",1,"",[[2,6,"fire"],[2,6,"fire"],[2,6,"fire"]],"You create three rays of fire and hurl them at targets within range. You can hurl them at one target or several."],["Beacon of Hope",3,"A","30 ft.",0,"",[],"This spell bestows hope and vitality. Choose any number of creatures within range. For the duration, each target has advantage on Wisdom saving throws and death saving throws, and regains the maximum number of hit points possible from any healing."],["Daylight",3,"A","60 ft.",0,"",[],"A 60-foot-radius sphere of light spreads out from a point you choose within range. The sphere is bright light and sheds dim light for an additional 60 feet."],["Find Steed",2,"10M","30 ft.",0,"",[],"You summon a spirit that assumes the form of an unusually intelligent, strong, and loyal steed, creating a long-lasting bond with it. Appearing in an unoccupied space within range, the steed takes on a form that you choose: a warhorse, a pony, a camel, an elk, or a mastiff."],["Flaming Sphere",2,"A","60 ft.",1,"dex",[[2,6,"fire"]],"A 5-foot-diameter sphere of fire appears in an unoccupied space of your choice within range and lasts for the duration. Any creature that ends its turn within 5 feet of the sphere must make a Dexterity saving throw. The creature takes 2d6 fire damage on a failed save, or half as much damage on a successful one."],["See Invisibility",2,"A","Self",0,"",[],"For the duration, you see invisible creatures and objects as if they were visible, and you can see into the Ethereal Plane. Ethereal creatures and objects appear ghostly and translucent."],["Bestow Curse",3,"A","Touch",0,"wis",[],"You touch a creature, and that creature must succeed on a Wisdom saving throw or become cursed for the duration of the spell. When you cast this spell, choose the nature of the curse from the following options:"],["Locate Animals or Plants",2,"A","Self",0,"",[],"Describe or name a specific kind of beast or plant. Concentrating on the voice of nature in your surroundings, you learn the direction and distance to the closest creature or plant of that kind within 5 miles, if any are present."],["Silence",2,"A","120 ft.",0,"",[],"For the duration, no sound can be created within or pass through a 20-foot-radius sphere centered on a point you choose within range. Any creature or object entirely inside the sphere is immune to thunder damage, and creatures are deafened while entirely inside it."],["Call Lightning",3,"A","120 ft.",0,"dex",[[3,10,"lightning"]],"A storm cloud appears in the shape of a cylinder that is 10 feet tall with a 60-foot radius, centered on a point you can see within range directly above you. The spell fails if you can't see a point in the air where the storm cloud could appear (for example, if you are in a room that can't accommodate the cloud)."],["Find Traps",2,"A","120 ft.",0,"",[],"You sense the presence of any trap within range that is within line of sight. A trap, for the purpose of this spell, includes anything that would inflict a sudden or unexpected effect you consider harmful or undesirable, which was specifically intended as such by its creator."],["Rope Trick",2,"A","Touch",0,"",[],"You touch a length of rope that is up to 60 feet long. One end of the rope then rises into the air until the whole rope hangs perpendicular to the ground. At the upper end of the rope, an invisible entrance opens to an extradimensional space that lasts until the spell ends."],["Spike Growth",2,"A","150 ft.",0,"",[[2,4,"piercing"]],"The ground in a 20-foot radius centered on a point within range twists and sprouts hard spikes and thorns. The area becomes difficult terrain for the duration. When a creature moves into or within the area, it takes 2d4 piercing damage for every 5 feet it travels."],["Levitate",2,"A","60 ft.",0,"CON",[],"One creature or loose object of your choice that you can see within range rises vertically, up to 20 feet, and remains suspended there for the duration. The spell can levitate a target that weighs up to 500 pounds. An unwilling creature that succeeds on a Constitution saving throw is unaffected."],["Warding Bond",2,"A","Touch",0,"",[],"This spell wards a willing creature you touch and creates a mystic connection between you and the target until the spell ends. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has resistance to all damage. Also, each time it takes damage, you take the same amount of damage."],["Zone of Truth",2,"A","60 ft.",0,"cha",[],"You create a magical zone that guards against deception in a 15-foot-radius sphere centered on a point of your choice within range. Until the spell ends, a creature that enters the spell's area for the first time on a turn or starts its turn there must make a Charisma saving throw."],["Fear",3,"A","Self (30-foot cone)",0,"wis",[],"You project a phantasmal image of a creature's worst fears. Each creature in a 30-foot cone must succeed on a Wisdom saving throw or drop whatever it is holding and become frightened for the duration."],["Hallucinatory Terrain",4,"10M","300 ft.",0,"",[],"You make natural terrain in a 150-foot cube in range look, sound, and smell like some other sort of natural terrain. Thus, open fields or a road can be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain."],["Commune",5,"1M","Self",0,"",[],"You contact your deity or a divine proxy and ask up to three questions that can be answered with a yes or no. You must ask your questions before the spell ends. You receive a correct answer for each question."],["Contagion",5,"A","Touch",1,"CON",[],"Your touch inflicts disease. Make a melee spell attack against a creature within your reach. On a hit, the target is poisoned."],["Awaken",5,"8H","Touch",0,"",[],"After spending the casting time tracing magical pathways within a precious gemstone, you touch a Huge or smaller beast or plant. The target must have either no Intelligence score or an Intelligence of 3 or less. The target gains an Intelligence of 10. The target also gains the ability to speak one language you know."],["Bigby's Hand",5,"A","120 ft.",0,"",[],"You create a Large hand of shimmering, translucent force in an unoccupied space that you can see within range. The hand lasts for the spell's duration, and it moves at your command, mimicking the movements of your own hand."],["Circle of Death",6,"A","150 ft.",0,"CON",[[8,6,"necrotic"]],"A sphere of negative energy ripples out in a 60-foot-radius sphere from a point within range. Each creature in that area must make a Constitution saving throw. A target takes 8d6 necrotic damage on a failed save, or half as much damage on a successful one."],["Antipathy/Sympathy",8,"1H","60 ft.",0,"wis",[],"This spell attracts or repels creatures of your choice. You target something within range, either a Huge or smaller object or creature or an area that is no larger than a 200-foot cube. Then specify a kind of intelligent creature, such as red dragons, goblins, or vampires."],["Blight",4,"A","30 ft.",0,"CON",[[8,8,"necrotic"]],"Necromantic energy washes over a creature of your choice that you can see within range, draining moisture and vitality from it. The target must make a Constitution saving throw. The target takes 8d8 necrotic damage on a failed save, or half as much damage on a successful one."],["Compulsion",4,"A","30 ft.",0,"wis",[],"Creatures of your choice that you can see within range and that can hear you must make a Wisdom saving throw. A target automatically succeeds on this saving throw if it can't be charmed. On a failed save, a target is affected by this spell."],["Create Undead",6,"1M","10 ft.",0,"",[],"You can cast this spell only at night. Choose up to three corpses of Medium or Small humanoids within range. Each corpse becomes a ghoul under your control. (The DM has game statistics for these creatures.)"],["Blade Barrier",6,"A","90 ft.",0,"dex",[[6,10,"slashing"]],"You create a vertical wall of whirling, razor-sharp blades made of magical energy. The wall appears within range and lasts for the duration. You can make a straight wall up to 100 feet long, 20 feet high, and 5 feet thick, or a ringed wall up to 60 feet in diameter, 20 feet high, and 5 feet thick."],["Conjure Fey",6,"1M","90 ft.",0,"",[],"You summon a fey creature of challenge rating 6 or lower, or a fey spirit that takes the form of a beast of challenge rating 6 or lower. It appears in an unoccupied space that you can see within range. The fey creature disappears when it drops to 0 hit points or when the spell ends."],["Contingency",6,"10M","Self",0,"",[],"Choose a spell of 5th level or lower that you can cast, that has a casting time of 1 action, and that can target you. You cast that spell—called the contingent spell—as part of casting contingency, expending spell slots for both, but the contingent spell doesn't come into effect."],["Chain Lightning",6,"A","150 ft.",0,"dex",[[10,8,"lightning"]],"You create a bolt of lightning that arcs toward a target of your choice that you can see within range. Three bolts then leap from that target to as many as three other targets, each of which must be within 30 feet of the first target. A target can be a creature or an object and can be targeted by only one of the bolts."],["Cloudkill",5,"A","120 ft.",0,"CON",[[5,8,"poison"]],"You create a 20-foot-radius sphere of poisonous, yellow-green fog centered on a point you choose within range. The fog spreads around corners. It lasts for the duration or until strong wind disperses the fog, ending the spell. Its area is heavily obscured."],["Conjure Woodland Beings",4,"A","60 ft.",0,"",[],"You summon fey creatures that appear in unoccupied spaces that you can see within range. Choose one of the following options for what appears:"],["Antimagic Field",8,"A","Self (10-foot radius)",0,"",[],"A 10-foot-radius invisible sphere of antimagic surrounds you. This area is divorced from the magical energy that suffuses the multiverse. Within the sphere, spells can't be cast, summoned creatures disappear, and even magic items become mundane. Until the spell ends, the sphere moves with you, centered on you."],["Clone",8,"1H","Touch",0,"",[],"This spell grows an inert duplicate of a living, Medium creature as a safeguard against death. This clone forms inside a sealed vessel and grows to full size and maturity after 120 days; you can also choose to have the clone be a younger version of the same creature."],["Commune with Nature",5,"1M","Self",0,"",[],"You briefly become one with nature and gain knowledge of the surrounding territory. In the outdoors, the spell gives you knowledge of the land within 3 miles of you. In caves and other natural underground settings, the radius is limited to 300 feet."],["Conjure Celestial",7,"1M","90 ft.",0,"",[],"You summon a celestial of challenge rating 4 or lower, which appears in an unoccupied space that you can see within range. The celestial disappears when it drops to 0 hit points or when the spell ends."],["Control Weather",8,"10M","Self (5-mile radius)",0,"",[],"You take control of the weather within 5 miles of you for the duration. You must be outdoors to cast this spell. Moving to a place where you don't have a clear path to the sky ends the spell early."],["Creation",5,"1M","30 ft.",0,"",[],"You pull wisps of shadow material from the Shadowfell to create a nonliving object of vegetable matter within range: soft goods, rope, wood, or something similar. You can also use this spell to create mineral objects such as stone, crystal, or metal."],["Arcane Eye",4,"A","30 ft.",0,"",[],"You create an invisible, magical eye within range that hovers in the air for the duration."],["Astral Projection",9,"1H","10 ft.",0,"",[],"You and up to eight willing creatures within range project your astral bodies into the Astral Plane (the spell fails and the casting is wasted if you are already on that plane). The material body you leave behind is unconscious and in a state of suspended animation, it doesn't need food or air and doesn't age."],["Confusion",4,"A","90 ft.",0,"wis",[],"This spell assaults and twists creatures' minds, spawning delusions and provoking uncontrolled action. Each creature in a 10-foot-radius sphere centered on a point you choose within range must succeed on a Wisdom saving throw when you cast this spell or be affected by it."],["Antilife Shell",5,"A","Self (10-foot radius)",0,"",[],"A shimmering barrier extends out from you in a 10-foot radius and moves with you, remaining centered on you and hedging out creatures other than undead and constructs. The barrier lasts for the duration."],["Contact Other Plane",5,"1M","Self",0,"int",[[6,6,"psychic"]],"You mentally contact a demigod, the spirit of a long-dead sage, or some other mysterious entity from another plane. Contacting this extraplanar intelligence can strain or even break your mind. When you cast this spell, make a DC 15 Intelligence saving throw."],["Control Water",4,"A","300 ft.",0,"",[],"Until the spell ends, you control any freestanding water inside an area you choose that is a cube up to 100 feet on a side. You can choose from any of the following effects when you cast this spell. As an action on your turn, you can repeat the same effect or choose a different one."],["Earthquake",8,"A","500 ft.",0,"",[],"You create a seismic disturbance at a point on the ground that you can see within range. For the duration, an intense tremor rips through the ground in a 100-foot-radius circle centered on that point and shakes creatures and structures in contact with the ground in that area."],["Glyph of Warding",3,"1H","Touch",0,"",[],"When you cast this spell, you inscribe a glyph that later unleashes a magical effect. You inscribe it either on a surface (such as a table or a section of floor or wall) or within an object that can be closed (such as a book, a scroll, or a treasure chest) to conceal the glyph."],["Greater Restoration",5,"A","Touch",0,"",[],"You imbue a creature you touch with positive energy to undo a debilitating effect. You can reduce the target's exhaustion level by one, or end one of the following effects on the target:"],["Legend Lore",5,"10M","Self",0,"",[],"Name or describe a person, place, or object. The spell brings to your mind a brief summary of the significant lore about the thing you named. The lore might consist of current tales, forgotten stories, or even secret lore that has never been widely known."],["Move Earth",6,"A","120 ft.",0,"",[],"Choose an area of terrain no larger than 40 feet on a side within range. You can reshape dirt, sand, or clay in the area in any manner you choose for the duration. You can raise or lower the area's elevation, create or fill in a trench, erect or flatten a wall, or form a pillar."],["Etherealness",7,"A","Self",0,"",[],"You step into the border regions of the Ethereal Plane, in the area where it overlaps with your current plane. You remain in the Border Ethereal for the duration or until you use your action to dismiss the spell. During this time, you can move in any direction."],["Fabricate",4,"10M","120 ft.",0,"",[],"You convert raw materials into products of the same material. For example, you can fabricate a wooden bridge from a clump of trees, a rope from a patch of hemp, and clothes from flax or wool."],["Freedom of Movement",4,"A","Touch",0,"",[],"You touch a willing creature. For the duration, the target's movement is unaffected by difficult terrain, and spells and other magical effects can neither reduce the target's speed nor cause the target to be paralyzed or restrained."],["Hypnotic Pattern",3,"A","120 ft.",0,"wis",[],"You create a twisting pattern of colors that weaves through the air inside a 30-foot cube within range. The pattern appears for a moment and vanishes. Each creature in the area who sees the pattern must make a Wisdom saving throw. On a failed save, the creature becomes charmed for the duration."],["Mass Healing Word",3,"BA","60 ft.",0,"",[[1,4,"healing"]],"As you call out words of restoration, up to six creatures of your choice that you can see within range regain hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs."],["Arcane Sword",7,"A","60 ft.",1,"",[[3,10,"force"]],"You create a sword-shaped plane of force that hovers within range. It lasts for the duration."],["Demiplane",8,"A","60 ft.",0,"",[],"You create a shadowy door on a flat solid surface that you can see within range. The door is large enough to allow Medium creatures to pass through unhindered. When opened, the door leads to a demiplane that appears to be an empty room 30 feet in each dimension, made of wood or stone."],["Dimension Door",4,"A","500 ft.",0,"",[],"You teleport yourself from your current location to any other spot within range. You arrive at exactly the spot desired. It can be a place you can see, one you can visualize, or one you can describe b…"],["Dispel Evil and Good",5,"A","Self",0,"",[],"Shimmering energy surrounds and protects you from fey, undead, and creatures originating from beyond the Material Plane. For the duration, celestials, elementals, fey, fiends, and undead have disadvantage on attack rolls against you."],["Divination",4,"A","Self",0,"",[],"Your magic and an offering put you in contact with a god or a god's servants. You ask a single question concerning a specific goal, event, or activity to occur within 7 days. The DM offers a truthful reply. The reply might be a short phrase, a cryptic rhyme, or an omen."],["Fire Shield",4,"A","Self",0,"",[],"Thin and wispy flames wreathe your body for the duration, shedding bright light in a 10-foot radius and dim light for an additional 10 feet. You can end the spell early by using an action to dismiss it."],["Hold Monster",5,"A","90 ft.",0,"wis",[],""],["Secret Chest",4,"A","Touch",0,"",[],"You hide a chest, and all its contents, on the Ethereal Plane. You must touch the chest and the miniature replica that serves as a material component for the spell. The chest can contain up to 12 cubic feet of nonliving material (3 feet by 2 feet by 2 feet)."],["Tiny Hut",3,"1M","Self (10-foot-radius hemisphere)",0,"",[],"A 10-foot-radius immobile dome of force springs into existence around and above you and remains stationary for the duration. The spell ends if you leave its area."],["Mass Heal",9,"A","60 ft.",0,"",[],"A flood of healing energy flows from you into injured creatures around you. You restore up to 700 hit points, divided as you choose among any number of creatures that you can see within range. Creatures healed by this spell are also cured of all diseases and any effect making them blinded or deafened."],["Meteor Swarm",9,"A","1 mile",0,"dex",[[20,6,"fire"],[20,6,"bludgeoning"]],"Blazing orbs of fire plummet to the ground at four different points you can see within range. Each creature in a 40-foot-radius sphere centered on each point you choose must make a Dexterity saving throw. The sphere spreads around corners."],["Mirage Arcane",7,"10M","Sight",0,"",[],"You make terrain in an area up to 1 mile square look, sound, smell, and even feel like some other sort of terrain. The terrain's general shape remains the same, however. Open fields or a road could be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain."],["Dominate Beast",4,"A","60 ft.",0,"wis",[],"You attempt to beguile a beast that you can see within range. It must succeed on a Wisdom saving throw or be charmed by you for the duration. If you or creatures that are friendly to you are fighting it, it has advantage on the saving throw."],["Black Tentacles",4,"A","90 ft.",0,"dex",[[3,6,"bludgeoning"]],"Squirming, ebony tentacles fill a 20-foot square on ground that you can see within range. For the duration, these tentacles turn the ground in the area into difficult terrain."],["Eyebite",6,"A","Self",0,"wis",[],"For the spell's duration, your eye
