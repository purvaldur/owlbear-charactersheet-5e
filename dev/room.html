<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex dev room</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  </head>
  <body>
    <div class="proto">
      <div class="proto-title"><b>Codex dev room</b><span>Simulated Owlbear room with synthetic sample sheets. Not shipped.</span></div>
      <button class="pbtn proto-toggle" id="p-toggle" type="button" aria-expanded="false" aria-controls="p-ctl">Room controls</button>
      <div class="proto-ctl" id="p-ctl">
        <label class="proto-group"><span>You are</span>
          <select id="p-role"><option value="PLAYER">Sam, a player</option><option value="GM">The GM</option></select>
        </label>
        <label class="proto-group"><span>OBR theme</span>
          <select id="p-theme"><option value="dark">Dark</option><option value="light">Light</option></select>
        </label>
        <label class="proto-group"><span>Someone rolls</span>
          <select id="p-incoming">
            <option value="">Choose…</option>
            <option value="breath">GM: Ash Drake, Fire Breath (DEX save)</option>
            <option value="bolt">Robin: Maren, Guiding Bolt</option>
          </select>
        </label>
        <label class="proto-group"><span>Jump to state</span>
          <select id="p-state">
            <option value="">Choose…</option>
            <option value="firstrun">First run, no sheets</option>
            <option value="down">Character at 0 HP</option>
            <option value="reset">Reset everything</option>
          </select>
        </label>
      </div>
    </div>
    <div class="room" id="room"><div id="app"></div></div>
    <script type="module" src="./room.ts"></script>
  </body>
</html>
